<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Panel</title>
    <base href="/" />
    <!--
        Host page for dockview popout groups, used by MudExDockLayout.PopoutUrl.
        Intentionally almost empty: dockview clones the opener's stylesheets into this document and moves the
        panel's dom node in here. Blazor is NOT started again - the node keeps belonging to the opener's
        renderer, so the panel stays live.
    -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--mud-palette-surface, #fff);
            color: var(--mud-palette-text-primary, #000);
        }

        body > .dv-popout-window {
            height: 100%;
        }
    </style>
</head>
<body></body>
</html>
