# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: MudBlazor.Extensions — server sample
description: "The Blazor Server sample, which exercises every component in the library."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  - run: dotnet restore

inputs:
  - id: Mode
    label: Mode
    type: select
    description: >-
      Wich app mode to start.
    options: [WebAssembly, ServerSide]
    default: WebAssembly     

tasks:
  - name: app
    run: dotnet run --project Samples/MainSample.${inputs.Mode} --urls http://localhost:5085
    readyWhen: {http: "http://localhost:5085"}
    open: true
