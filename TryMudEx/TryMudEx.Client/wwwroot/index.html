    <mud-ex-app-loader AppName="{{BRAND_NAME}}" AccentColor="{{BRAND_ACCENT}}" MainAppId="app" Logo="{{BRAND_LOGO}}">

    <div id="app" class="mud-height-full">

            </div>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Inside the preview iframe: forward console output and unhandled errors to the
        // hosting repl so they show up in its console panel. Installed before blazor starts
        // so early startup errors are captured too.
        (function () {
            if (window.self === window.top) { return; }

            var post = function (level, text) {
                try { parent.postMessage({ __try: 'log', level: level, text: text, ts: Date.now() }, location.origin); } catch (e) { }
            };
            var stringify = function (args) {
                return Array.prototype.map.call(args, function (a) {
                    if (a instanceof Error) { return a.stack || (a.name + ': ' + a.message); }
                    if (typeof a === 'object' && a !== null) { try { return JSON.stringify(a); } catch (e) { return String(a); } }
                    return String(a);
                }).join(' ');
            };

            ['log', 'info', 'warn', 'error', 'debug'].forEach(function (level) {
                var original = console[level];
                console[level] = function () {
                    post(level, stringify(arguments));
                    if (original) { original.apply(console, arguments); }
                };
            });

            window.addEventListener('error', function (e) {
                post('error', e.error ? (e.error.stack || e.error.message) : (e.message + ' (' + e.filename + ':' + e.lineno + ')'));
            });
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                post('error', 'Unhandled rejection: ' + (r && (r.stack || r.message) ? (r.stack || r.message) : String(r)));
            });
        })();
    </script>

    <!-- WICHTIG: autostart="false", damit unser eigenes Blazor.start(...) genutzt wird -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // wir interessieren uns nur für die UserComponents-Assembly
                if (type === 'assembly' && name === 'Try.UserComponents.dll') {

                    const dllBytes =
                        window.Try &&
                        window.Try.CodeExecution &&
                        window.Try.CodeExecution.getUserComponentsDllBytes &&
                        window.Try.CodeExecution.getUserComponentsDllBytes();

                    if (dllBytes && dllBytes.length) {
                        const blob = new Blob([dllBytes], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);

                        return fetch(url).finally(() => URL.revokeObjectURL(url));
                    }

                    // noch keine Bytes hinterlegt: normale DLL laden
                    return defaultUri;
                }

                // alle anderen Ressourcen normal laden
                return defaultUri;
            }
        });
    </script>
