name: Publish Nuget Preview Package and deploy Test App

on:
  push:
    branches:
      - '**'

env:
  # a reused msbuild node keeps the file globs of its first evaluation, which silently dropped
  # the web component bundle from the package
  MSBUILDDISABLENODEREUSE: 1
  AZURE_WEBAPP_NAME: MudEx
  AZURE_WEBAPP_PACKAGE_PATH: SampleApplication/publish
  AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.MudEx_016e }}
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: Samples/MainSample.WebAssembly

jobs:
  build_and_deploy_preview_package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required so nuget.org can trade the OIDC token for a short lived key
    steps:
    - name: Set Branch Name as Environment Variable
      run: |
        # Extract branch name
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
    
        # Ensure branch name is safe for NuGet versioning (replace '/' with '-')
        SAFE_BRANCH_NAME=${BRANCH_NAME////-}
    
        # Set SAFE_BRANCH_NAME as an environment variable for subsequent steps
        echo "SAFE_BRANCH_NAME=$SAFE_BRANCH_NAME" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:        
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ./MudBlazor.Extensions/MudBlazor.Extensions.csproj

    - name: First Build (ignore errors)
      continue-on-error: true
      run: dotnet build ./MudBlazor.Extensions/MudBlazor.Extensions.csproj --configuration Debug --no-restore

    - name: Build with Branch Name Suffix
      shell: pwsh
      run: |
        dotnet build ./MudBlazor.Extensions/MudBlazor.Extensions.csproj -p:VersionSuffix=prev-$([System.DateTime]::Now.ToString('yyMMddHHm'))-$env:SAFE_BRANCH_NAME --configuration Debug --no-restore
        
    #- name: Run Tests
    #  run: dotnet test ./MudBlazor.Extensions.Tests/MudBlazor.Extensions.Tests.csproj

    # the key this returns lives for one hour and the OIDC token behind it can only be
    # traded once, so this step has to stay directly in front of the push
    - name: NuGet trusted publishing login
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: fgilde   # nuget.org account name, not the mail address

    - name: Publish Package
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      shell: pwsh
      run: |
        Get-ChildItem -Path MudBlazor.Extensions/bin/Debug -Filter *.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName -k $env:NUGET_API_KEY -s https://api.nuget.org/v3/index.json --skip-duplicate
        }

  deploy_application_to_azure:
    needs: build_and_deploy_preview_package
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    
    # Delay to ensure the Nuget package is indexed before Azure deployment
    - name: Delay
      run: sleep 300
      
    # Must run before the restore of the sample: it drops the bundle into the sample wwwroot/wc, and
    # the sample only picks those files up if they already exist when its project is first evaluated.
    # MSBuild reuses its nodes across steps, so a later build keeps the file globs from that first pass.
    - name: Publish Web Components
      run: dotnet publish Samples/MudEx.WebComponents/MudEx.WebComponents.csproj --configuration ${{ env.CONFIGURATION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Verify the web component bundle is in the package
      shell: pwsh
      run: |
        $loader = Join-Path "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}" "wwwroot/wc/mudex.js"
        if (-not (Test-Path $loader)) {
          throw "Web component bundle missing from the package ($loader). www.mudex.org/wc would serve the spa fallback."
        }
        $size = [math]::Round((Get-ChildItem -Recurse (Split-Path $loader) | Measure-Object -Sum Length).Sum / 1MB, 1)
        Write-Host "Web component bundle in package: $size MB"

    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4.0.0
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
