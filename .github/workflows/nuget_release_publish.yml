name: Publish Nuget Release Package

on:
  release:
    types:
      - created

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # job level so the step condition below can read it, secrets are not available in "if"
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write   # required so nuget.org can trade the OIDC token for a short lived key

    steps:
     
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}      
  
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./MudBlazor.Extensions/MudBlazor.Extensions.csproj
      
    - name: First Build (ignore errors)
      continue-on-error: true
      run: dotnet build ./MudBlazor.Extensions/MudBlazor.Extensions.csproj --configuration Release --no-restore

    - name: Second Build
      run: dotnet build ./MudBlazor.Extensions/MudBlazor.Extensions.csproj --configuration Release --no-restore      

    # the key this returns lives for one hour and the OIDC token behind it can only be
    # traded once, so this step has to stay directly in front of the push
    - name: NuGet trusted publishing login
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: fgilde   # nuget.org account name, not the mail address

    - name: Publish Package
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      shell: pwsh
      run: |
        Get-ChildItem -Path MudBlazor.Extensions/bin/Release -Filter *.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName -k $env:NUGET_API_KEY -s https://api.nuget.org/v3/index.json
        }

    # same bundle that is served from www.mudex.org/wc, published to npm so it is available
    # on jsdelivr/unpkg. Skipped silently when no NPM_TOKEN secret is configured.
    - name: Publish web components to npm
      if: ${{ env.NPM_TOKEN != '' }}
      run: |
        dotnet publish Samples/MudEx.WebComponents/MudEx.WebComponents.csproj --configuration Release
        cd Samples/MudEx.WebComponents/bin/Release/net10.0/publish/wwwroot
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        npm publish
