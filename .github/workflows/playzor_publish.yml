name: Publish Playzor Packages

on:
  # a tag decides the version: playzor-v1.2.3 publishes 1.2.3
  push:
    tags:
      - 'playzor-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.1 or 1.1.0-preview.1'
        required: true
        type: string
      dry_run:
        description: 'Build and pack only, do not push to nuget.org'
        required: false
        default: false
        type: boolean

env:
  DOTNET_CORE_VERSION: 10.0.x
  PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts/playzor

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required so nuget.org can trade the OIDC token for a short lived key

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Resolve version
      id: version
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION="${GITHUB_REF_NAME#playzor-v}"
        fi
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing Playzor $VERSION"

    # the packages reference MudBlazor.Extensions from this repository, so it has to build first
    - name: Build MudBlazor.Extensions
      run: dotnet build ./MudBlazor.Extensions/MudBlazor.Extensions.csproj --configuration Release

    - name: Pack
      run: |
        for project in Playzor.UserComponents Playzor.Core Playzor.Blazor Playzor.Blazor.Editor Playzor.Server; do
          dotnet pack "./$project/$project.csproj" \
            --configuration Release \
            -p:PlayzorVersion=${{ steps.version.outputs.value }} \
            --output "${{ env.PACKAGE_OUTPUT }}"
        done

    - name: List packages
      run: ls -la "${{ env.PACKAGE_OUTPUT }}"

    - name: Upload packages as artifact
      uses: actions/upload-artifact@v4
      with:
        name: playzor-packages-${{ steps.version.outputs.value }}
        path: ${{ env.PACKAGE_OUTPUT }}/*

    # the key this returns lives for one hour and the OIDC token behind it can only be
    # traded once, so this step has to stay directly in front of the push
    - name: NuGet trusted publishing login
      if: ${{ inputs.dry_run != true }}
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: fgilde   # nuget.org account name, not the mail address

    - name: Push to nuget.org
      if: ${{ inputs.dry_run != true }}
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      shell: bash
      run: |
        # dependencies first, so a consumer never resolves a package whose dependency is missing
        for project in Playzor.UserComponents Playzor.Core Playzor.Blazor Playzor.Blazor.Editor Playzor.Server; do
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}/$project.${{ steps.version.outputs.value }}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done
